<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VeRaFIED — worldwide station</title>
<meta name="theme-color" content="#0a0a0a" />
<style>
:root{--bg:#0a0a0a;--fg:#fff4ee;--muted:#c4a090;--red:#e11d2e;--orange:#ff6b1a;--card:#140c0c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
header{padding:1rem 1.25rem;display:flex;justify-content:space-between;border-bottom:1px solid #1c1010}
.mark{font-weight:800;font-size:1.25rem;letter-spacing:-.04em}
.mark span{color:var(--orange)}
.onair{color:var(--muted);font-size:.75rem;letter-spacing:.08em}
main{flex:1;padding:1.25rem;max-width:32rem;margin:0 auto;width:100%}
.nowbox{background:var(--card);border-radius:1.1rem;padding:1.25rem;margin-bottom:1.25rem}
h2{margin:.15rem 0 0;font-size:1.35rem}
.sub{margin:.2rem 0 1rem;color:var(--muted)}
.live{appearance:none;border:0;border-radius:999px;padding:.95rem 1.2rem;font-weight:700;font-size:1rem;background:var(--red);color:#fff4ee;cursor:pointer;width:100%}
.err{color:#ff8a8a;min-height:1.1em;margin:.6rem 0 0}
.note{color:var(--muted);font-size:.8rem}
footer{position:fixed;left:0;right:0;bottom:0;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));background:#140c0c;border-top:1px solid #2a1515;display:flex;align-items:center;gap:1rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.now{flex:1;min-width:0}
.now strong,.now small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{color:var(--muted)}
.pause{appearance:none;border:0;background:#1c1010;color:var(--fg);border-radius:999px;padding:.55rem .9rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="mark">VeRa<span>FIED</span></div>
  <div class="onair">ON AIR</div>
</header>
<main>
  <div class="nowbox">
    <div class="onair">NOW PLAYING</div>
    <h2 id="title">After Hours</h2>
    <p class="sub" id="artist">VeRaFIED Music</p>
    <button class="live" id="join" type="button">Join live</button>
    <p class="err" id="err"></p>
    <p class="note">Cape Coral · listen free · $5 / $2 to Tiffaney Latorre · tiffaneylatorre@gmail.com</p>
  </div>
</main>
<footer>
  <span class="dot"></span>
  <div class="now"><strong id="barTitle">Tap Join live</strong><small id="barArtist">Worldwide station</small></div>
  <button class="pause" id="pause" type="button" hidden>Pause</button>
</footer>
<audio id="audio" playsinline></audio>
<script>
const EPOCH = Date.UTC(2026, 0, 1);
const CDN = "https://cdn.jsdelivr.net/gh/latorre0825-creator/verafied-station@main/audio/";
const tracks = [
  { title: "After Hours", artist: "VeRaFIED Music", src: CDN + "after-hours.mp3", durationMs: 16000 },
  { title: "Lobby Light", artist: "VeRaFIED Music", src: CDN + "lobby-light.mp3", durationMs: 16000 },
  { title: "Signal Lost", artist: "VeRaFIED Music", src: CDN + "signal-lost.mp3", durationMs: 16000 },
];
const audio = document.getElementById("audio");
const join = document.getElementById("join");
const pauseBtn = document.getElementById("pause");
const err = document.getElementById("err");
let joined = false;
function stationNow() {
  const total = tracks.reduce((s, t) => s + t.durationMs, 0);
  let elapsed = (Date.now() - EPOCH) % total;
  if (elapsed < 0) elapsed += total;
  let acc = 0;
  for (const track of tracks) {
    if (elapsed < acc + track.durationMs) return { track, positionMs: elapsed - acc };
    acc += track.durationMs;
  }
  return { track: tracks[0], positionMs: 0 };
}
function paint(t) {
  document.getElementById("title").textContent = t.title;
  document.getElementById("artist").textContent = t.artist;
  document.getElementById("barTitle").textContent = t.title;
  document.getElementById("barArtist").textContent = t.artist + " · worldwide";
}
function playAt(track, positionMs) {
  err.textContent = "";
  audio.src = track.src;
  const start = Math.min(Math.max(0, positionMs / 1000), 15.8);
  const go = () => { try { audio.currentTime = start; } catch (_) {} audio.play(); };
  if (audio.readyState >= 1) go();
  else audio.addEventListener("loadedmetadata", go, { once: true });
  paint(track);
  return audio.play();
}
function joinLive() {
  joined = true;
  join.textContent = "On air";
  pauseBtn.hidden = false;
  pauseBtn.textContent = "Pause";
  const now = stationNow();
  playAt(now.track, now.positionMs).catch(() => {
    err.textContent = "Tap Join live again — the phone needs a tap to play.";
    joined = false;
    join.textContent = "Join live";
  });
}
join.onclick = joinLive;
pauseBtn.onclick = () => {
  if (audio.paused) { if (!joined) joinLive(); else { audio.play(); pauseBtn.textContent = "Pause"; } }
  else { audio.pause(); pauseBtn.textContent = "Play"; }
};
audio.addEventListener("ended", () => { if (joined) { const n = stationNow(); playAt(n.track, n.positionMs).catch(() => {}); } });
paint(stationNow().track);
setInterval(() => { if (!joined) paint(stationNow().track); }, 1000);
</script>
</body>
</html>
